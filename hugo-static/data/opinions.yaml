pl:
  - text: |
      "Rozdano nagrody w kategoriach:
      <br /> Identyfikacja Źródeł Zanieczyszczenia
      Powietrza (patron kategorii: Krakowski Alarm
      Smogowy) – Zespół <strong>AI Embassy</strong>:
      Innowacyjna Metoda analizy danych o
      zanieczyszczeniu korzystająca z danych
      satelitarnych oraz sztucznej inteligencji."
    source: "https://smogathon.com/pl/smogaton-2019-hackathon-z-wykorzystaniem-danych/"
    sourceName: "smogathon.com.pl"
  - text: |
      "W kategorii Identyfikacja źródeł
      zanieczyszczenia powietrza najlepszy okazał się
      zespół <strong>AI Embassy</strong>. Przedstawił
      on innowacyjną metodę analizy danych o
      zanieczyszczeniu korzystającą z danych
      satelitarnych oraz sztucznej inteligencji."
    source: "https://firma.rp.pl/biznes/4431-nowe-technologie-dla-srodowiska-znamy-laureatow-smogathonu-2019"
    sourceName: "firma.rp.pl"

en:
  - text: |
      "Awards were given in the following categories:
      <br /> Identification of Air Pollution Sources (category
      patron: Krakow Smog Alert) - <strong>AI Embassy</strong>
      Team: An innovative method of pollution data analysis using
      satellite data and artificial intelligence."
    source: "https://smogathon.com/pl/smogaton-2019-hackathon-z-wykorzystaniem-danych/"
    sourceName: "smogathon.com.pl"
  - text: |
      "In the category of Identifying air pollution sources, the
      <strong>AI Embassy</strong> team turned out to be the best.
      He presented an innovative method of analyzing pollution data
      using satellite data and artificial intelligence. "
    source: "https://firma.rp.pl/biznes/4431-nowe-technologie-dla-srodowiska-znamy-laureatow-smogathonu-2019"
    sourceName: "firma.rp.pl"
